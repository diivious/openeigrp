# Copyright (C) 2026 Donnie V. Savage
# EIGRP portable/core CI. The root Makefile owns test orchestration.
#
# Validate every commit to master. For feature branches with open master PRs,
# the PR validates the proposed merge instead of duplicating branch tests.
# Gate: fast compile/smoke -> CodeQL -> full macOS/Linux UUT.
# Use CodeQL advanced setup rather than default setup to avoid duplicate scans.

name: EIGRP Core CI

on:
  push:
    # Validate every branch, including master. Release tags use Docker CI.
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Newer runs supersede older runs for the same event/ref only. Keep PR and
# branch events isolated; manual runs must not cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    name: Select regression
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check for an existing PR targeting master
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            let run = true;
            if (context.eventName === 'push' && context.ref !== 'refs/heads/master') {
              const branch = context.ref.slice('refs/heads/'.length);
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 100
              });
              run = !prs.some(pr => pr.base.ref === 'master');
              if (!run) core.info('Open master PR found; PR validation handles this push.');
            }
            core.setOutput('run_tests', String(run));

  fast:
    name: Fast Gate
    needs: [select]
    if: ${{ needs.select.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Complete history is needed for multi-commit push/PR diffs.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned clang-format 23.1.4
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: style
          create-args: clang-format=23.1.4
          init-shell: none

      - name: Put pinned clang-format on PATH
        run: |
          echo "$MAMBA_ROOT_PREFIX/envs/style/bin" >> "$GITHUB_PATH"
          "$MAMBA_ROOT_PREFIX/envs/style/bin/clang-format" --version

      - name: Validate changed source style
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # Checkout's synthetic merge commit: compare to target branch parent.
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              # Check the entire pushed range, not only the latest commit.
              base="$PUSH_BEFORE"
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                base="$(git merge-base HEAD origin/master || true)"
                if [[ -z "$base" || "$base" == "$(git rev-parse HEAD)" ]]; then
                  base="$(git rev-parse HEAD^)"
                fi
              fi
              ;;
            *)
              base="$(git rev-parse HEAD^)"
              ;;
          esac
          make check STYLE_CHECK_BASE="$base"

      - name: Install fast-test dependencies
        run: python3 -m pip install pytest PyYAML

      - name: Build portable and Unix sources
        run: make build

      - name: Run pacing, topology-index, and fresh-uptime smoke tests
        run: |
          python3 -m pytest -q \
            eigrp/test/packet/pacing.py \
            eigrp/test/scale/test_table_index.py \
            eigrp/test/uut/test_process_limit_low_uptime.py

  codeql:
    name: CodeQL / Analyze (${{ matrix.language }})
    needs: [fast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      # A failed language analysis cancels the other analyses; full UUT never
      # starts unless ALL three languages have completed successfully.
      fail-fast: true
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C/C++ for CodeQL extraction
        if: matrix.language == 'c-cpp'
        run: make build

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  core:
    # Keep the check name stable: GitHub rulesets require "... / make test".
    name: ${{ matrix.os }} / make test
    needs: [codeql]
    strategy:
      # Collect independent Linux and macOS results even if one fails.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install portable test dependencies
        run: python3 -m pip install pytest PyYAML

      - name: Run portable/core gate
        shell: bash
        env:
          EIGRP_PYTHON: python3
        run: |
          set -o pipefail
          make uut 2>&1 | tee make-test.log

      - name: Trace Linux UUT aborts on failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        env:
          EIGRP_PYTHON: python3
        run: |
          set -o pipefail
          python3 eigrp/test/uut/trace_linux_abort.py 2>&1 | tee abort-trace.log

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eigrp-core-${{ matrix.os }}-failure-log
          path: |
            make-test.log
            abort-trace.log
            eigrp/test/uut/logs/
            eigrp/test/uut/abort-trace/*.log
            eigrp/test/uut/abort-trace/*.txt
            eigrp/test/uut/eigrp-uut-node
          if-no-files-found: warn

  pipeline:
    # Only the PR gate should be configured as a required merge check.
    name: ${{ github.event_name == 'pull_request' && 'PR merge gate' || 'Branch regression result' }}
    needs: [select, fast, codeql, core]
    # A branch push covered by a PR needs no second pipeline; real gate errors
    # must still be reported as failures, never as passing/skipped PR checks.
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.run_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all stages to pass
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          CORE_RESULT: ${{ needs.core.result }}
        shell: bash
        run: |
          printf 'Selection: %s\nFast Gate: %s\nCodeQL: %s\nCore CI: %s\n' \
            "$SELECT_RESULT" "$FAST_RESULT" "$CODEQL_RESULT" "$CORE_RESULT"
          [[ "$SELECT_RESULT" == success && "$FAST_RESULT" == success && "$CODEQL_RESULT" == success && "$CORE_RESULT" == success ]]
