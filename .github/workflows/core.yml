# Copyright (C) 2026 Donnie V. Savage
# EIGRP portable/core CI. The root Makefile owns test orchestration.
#
# Run fast compile/style/portable smoke checks on branch pushes and master PRs.
# After a merge reaches master, run the complete regression on Linux and macOS.
# Branch pushes already represented by an open master PR are deduplicated.
# Gate: style -> CodeQL -> Fast Gate -> macOS -> Ubuntu -> Docker/Debian.
# Pull-request artifact workflows run only after all earlier gates pass.
# Use CodeQL advanced setup rather than default setup to avoid duplicate scans.

name: EIGRP Core CI

on:
  push:
    # Validate every branch, including master. Release tags use Docker CI.
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Newer runs supersede older runs for the same event/ref only. Keep PR and
# branch events isolated; manual runs must not cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    name: Select regression
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.run_tests }}
    steps:
      - name: Check for an existing PR targeting master
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            let run = true;
            if (context.eventName === 'push' && context.ref !== 'refs/heads/master') {
              const branch = context.ref.slice('refs/heads/'.length);
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 100
              });
              run = !prs.some(pr => pr.base.ref === 'master');
              if (!run) core.info('Open master PR found; PR validation handles this push.');
            }
            core.setOutput('run_tests', String(run));

  style:
    name: Source style gate
    needs: [select]
    if: ${{ needs.select.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install style dependencies
        run: python3 -m pip install clang-format

      - name: Validate changed source style
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # Checkout's synthetic merge commit: compare to target branch parent.
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              # Check the entire pushed range, not only the latest commit.
              base="$PUSH_BEFORE"
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                base="$(git merge-base HEAD origin/master || true)"
                if [[ -z "$base" || "$base" == "$(git rev-parse HEAD)" ]]; then
                  base="$(git rev-parse HEAD^)"
                fi
              fi
              ;;
            *)
              base="$(git rev-parse HEAD^)"
              ;;
          esac
          ./tools/python tools/style-check.py --base "$base"
          ./tools/python tools/test/test_style_check.py
          ./tools/python tools/test/test_style_fix.py


  codeql:
    name: CodeQL / Analyze (${{ matrix.language }})
    needs: [style]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      # A failed language analysis cancels the other analyses; full UUT never
      # starts unless ALL three languages have completed successfully.
      fail-fast: true
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CI version is derived from the checked-out commit.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C/C++ for CodeQL extraction
        if: matrix.language == 'c-cpp'
        run: make linux

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}


  fast:
    name: Fast Gate
    needs: [codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Complete history is needed for multi-commit push/PR diffs.

      - name: Pin CI build identity across workflow steps
        shell: bash
        run: |
          set -euo pipefail
          version="$(./tools/version.sh --ci)"
          ./tools/build-version.sh --binary "$version" >/dev/null
          printf 'EIGRP_BUILD_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'OpenEIGRP CI build identity: %s\n' "$version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install fast-test dependencies
        run: python3 -m pip install pytest PyYAML

      - name: Verify local and CI gate parity
        run: python3 -m unittest -q tools.test.test_ci_parity tools.test.test_ci_fail_fast

      - name: Build native Linux daemon and portable sources
        run: make linux

      - name: Run native Linux management and IPv6 packet regressions
        run: python3 -m pytest -q linux/test/test_mgnt.py linux/test/test_ipv6_packet.py

      - name: Run the same PR smoke gate as pre-commit
        run: make _ci-smoke


  macos:
    name: macos-latest / make test
    needs: [fast]
    runs-on: macos-latest
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CI version is derived from the checked-out commit.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install portable test and style dependencies
        run: python3 -m pip install pytest PyYAML clang-format

      - name: Run PR smoke gate on the target platform
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}
        env:
          EIGRP_PYTHON: python3
        run: make _ci-smoke

      - name: Run portable and native regression after merge or manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        shell: bash
        env:
          EIGRP_PYTHON: python3
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -o pipefail
          mkdir -p logs/uut/eigrp/ci
          if [[ "$RUNNER_OS" == Linux ]]; then
            make all
          else
            make _ci-core
          fi 2>&1 | tee logs/uut/eigrp/ci/make-core.log

      - name: Trace Linux UUT aborts on failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        env:
          EIGRP_PYTHON: python3
        run: |
          set -o pipefail
          mkdir -p logs/uut/eigrp/ci
          python3 eigrp/test/uut/trace_linux_abort.py 2>&1 | tee logs/uut/eigrp/ci/abort-trace.log

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eigrp-core-${{ runner.os }}-failure-log
          path: |
            logs/
            eigrp/test/uut/abort-trace/*.log
            eigrp/test/uut/abort-trace/*.txt
            eigrp/test/uut/eigrp-uut-node
          if-no-files-found: warn


  ubuntu:
    name: ubuntu-latest / make test
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out EIGRP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CI version is derived from the checked-out commit.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install portable test and style dependencies
        run: python3 -m pip install pytest PyYAML clang-format

      - name: Run PR smoke gate on the target platform
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}
        env:
          EIGRP_PYTHON: python3
        run: make _ci-smoke

      # The post-merge make all runs amd64 and arm64 Docker/apt builds on
      # one Ubuntu runner. PR builds use native per-architecture runners.
      - name: Enable non-native Docker architectures
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Verify Docker platform execution
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        run: ./tools/check-docker-platforms.sh

      - name: Run portable and native regression after merge or manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
        shell: bash
        env:
          EIGRP_PYTHON: python3
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -o pipefail
          mkdir -p logs/uut/eigrp/ci
          if [[ "$RUNNER_OS" == Linux ]]; then
            make all
          else
            make _ci-core
          fi 2>&1 | tee logs/uut/eigrp/ci/make-core.log

      - name: Trace Linux UUT aborts on failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        env:
          EIGRP_PYTHON: python3
        run: |
          set -o pipefail
          mkdir -p logs/uut/eigrp/ci
          python3 eigrp/test/uut/trace_linux_abort.py 2>&1 | tee logs/uut/eigrp/ci/abort-trace.log

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eigrp-core-${{ runner.os }}-failure-log
          path: |
            logs/
            eigrp/test/uut/abort-trace/*.log
            eigrp/test/uut/abort-trace/*.txt
            eigrp/test/uut/eigrp-uut-node
          if-no-files-found: warn


  # Reuse release-tested builders without independently triggering on PRs.
  # Both architectures in each workflow start only after Ubuntu succeeds.
  docker:
    name: Docker builds
    needs: [ubuntu]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-ci.yml
    permissions:
      contents: read

  debian:
    name: Debian packages
    needs: [ubuntu]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/debian-ci.yml
    permissions:
      contents: read

  pipeline:
    name: ${{ github.event_name == 'pull_request' && 'PR merge gate' || 'Branch regression result' }}
    needs: [select, style, codeql, fast, macos, ubuntu, docker, debian]
    # Evaluate every dependency even when an earlier job failed or was skipped.
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.run_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all stages to pass
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          STYLE_RESULT: ${{ needs.style.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          UBUNTU_RESULT: ${{ needs.ubuntu.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DEBIAN_RESULT: ${{ needs.debian.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Selection: %s\nStyle: %s\nCodeQL: %s\nFast Gate: %s\nmacOS: %s\nUbuntu: %s\nDocker: %s\nDebian: %s\n' \
            "$SELECT_RESULT" "$STYLE_RESULT" "$CODEQL_RESULT" "$FAST_RESULT" \
            "$MACOS_RESULT" "$UBUNTU_RESULT" "$DOCKER_RESULT" "$DEBIAN_RESULT"
          [[ "$SELECT_RESULT" == success && "$STYLE_RESULT" == success && \
             "$CODEQL_RESULT" == success && "$FAST_RESULT" == success && \
             "$MACOS_RESULT" == success && "$UBUNTU_RESULT" == success ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$DOCKER_RESULT" == success && "$DEBIAN_RESULT" == success ]]
          else
            [[ "$DOCKER_RESULT" == skipped && "$DEBIAN_RESULT" == skipped ]]
          fi
