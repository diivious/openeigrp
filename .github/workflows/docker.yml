# Alpine FRR + OpenEIGRP native amd64/arm64 build, integration test and GHCR release.
name: OpenEIGRP Docker

on:
  push:
    # Only versioned release tags publish images. Branch pushes never build Docker.
    tags: ['rel-*']
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/docker.yml'
      - 'docker/**'
      - 'tools/docker*.sh'
      - 'tools/docker*.py'
      - 'tools/frr-setup.sh'
      - 'tools/test/test_frr_release_selection.py'
      - 'frr/test/setup/**'
      - 'tools/frr.sh'
      - 'tools/frr-install.sh'
      - 'eigrp/code/**'
      - 'frr/code/**'
      - 'frr/patch/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing rel-X.Y.Z EIGRP tag to test (manual runs never publish)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v4
      - name: Test FRR release selection and checkout safety
        run: |
          python3 -m unittest -q \
            tools/test/test_frr_release_selection.py \
            frr/test/setup/test_frr_setup_tag.py
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Select immutable source refs
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' && "$GIT_REF" == refs/tags/* ]]; then
            eigrp_ref="${GIT_REF#refs/tags/}"
            [[ "$eigrp_ref" =~ ^rel-[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "invalid publication tag: $eigrp_ref" >&2; exit 1;
            }
            version="${eigrp_ref#rel-}"
            release=yes
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' && -n "$MANUAL_TAG" ]]; then
            eigrp_ref="$MANUAL_TAG"
            [[ "$eigrp_ref" =~ ^rel-[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "invalid test tag: $eigrp_ref" >&2; exit 1;
            }
            version="${eigrp_ref#rel-}"
            release=no
          else
            version="dev-${GIT_SHA:0:12}"
            if [[ "$EVENT_NAME" == pull_request ]]; then
              eigrp_ref="refs/pull/$PR_NUMBER/merge"
            else
              eigrp_ref="$GIT_SHA"
            fi
            release=no
          fi
          {
            echo "version=$version"
            echo "eigrp_ref=$eigrp_ref"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
      - name: Build from GitHub EIGRP and FRR sources
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          EIGRP_REF: ${{ steps.source.outputs.eigrp_ref }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="openeigrp-ci:$VERSION-$ARCH"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ./tools/docker.sh --build "$VERSION" --platform "$PLATFORM" --image "$image"
          else
            ./tools/docker.sh --build "$VERSION" --platform "$PLATFORM" --image "$image" \
              --eigrp-ref "$EIGRP_REF"
          fi
      - name: Verify FRR, configuration, adjacency and route exchange
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./tools/docker.sh --verify "openeigrp-ci:$VERSION-$ARCH"
      - name: Save tested release architecture
        if: steps.source.outputs.release == 'yes'
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: docker save "openeigrp-ci:$VERSION-$ARCH" | gzip -1 > "image-$ARCH.tar.gz"
      - name: Transfer tested release architecture
        if: steps.source.outputs.release == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    name: Publish GHCR release manifest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download both tested architecture images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ./images
          merge-multiple: true
      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and publish architecture images and manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^rel-[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION="${RELEASE_TAG#rel-}"
          repository=ghcr.io/diivious/openeigrp-frr
          # Check every destination tag before pushing anything. Docker's
          # generic inspect error can mean network failure or permission denial;
          # only an authenticated OCI registry HTTP 404 means a tag is absent.
          registry_token="$(curl --fail --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 45 \
            --user "$GHCR_USERNAME:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:diivious/openeigrp-frr:pull' \
            | jq -er '.token // .access_token // empty')" || {
              echo 'unable to authenticate GHCR tag checks; publication stopped' >&2
              exit 1
            }
          [[ -n "$registry_token" ]] || {
            echo 'GHCR token response was empty; publication stopped' >&2
            exit 1
          }
          for tag in "$VERSION" "$VERSION-amd64" "$VERSION-arm64"; do
            status="$(curl --silent --show-error --head --retry 2 \
              --connect-timeout 15 --max-time 45 \
              --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/diivious/openeigrp-frr/manifests/$tag")" || {
                echo "GHCR registry request failed for $repository:$tag; publication stopped" >&2
                exit 1
              }
            case "$status" in
              404) ;;  # Confirmed absent.
              200)
                echo "refusing to overwrite published image: $repository:$tag" >&2
                exit 1 ;;
              *)
                echo "GHCR returned HTTP $status for $repository:$tag; publication stopped" >&2
                exit 1 ;;
            esac
          done
          for arch in amd64 arm64; do
            gzip -dc "images/image-$arch.tar.gz" | docker load
            local_image="openeigrp-ci:$VERSION-$arch"
            image_arch="$(docker image inspect -f '{{.Architecture}}' "$local_image")"
            image_os="$(docker image inspect -f '{{.Os}}' "$local_image")"
            image_version="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$local_image")"
            [[ "$image_arch" == "$arch" && "$image_os" == linux && "$image_version" == "$VERSION" ]] || exit 1
            git_eigrp="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")"
            git_frr="$(docker image inspect -f '{{index .Config.Labels "org.openeigrp.frr.revision"}}' "$local_image")"
            [[ "$git_eigrp" =~ ^[0-9a-f]{40}$ && "$git_frr" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if [[ "$arch" == arm64 ]]; then
              [[ "$git_eigrp" == "$eigrp_amd64" && "$git_frr" == "$frr_amd64" ]] || {
                echo 'architecture builds have different Git source revisions' >&2; exit 1;
              }
            else
              eigrp_amd64="$git_eigrp"
              frr_amd64="$git_frr"
            fi
          done
          # Nothing is published until BOTH builds and integration tests succeed.
          for arch in amd64 arm64; do
            docker tag "openeigrp-ci:$VERSION-$arch" "$repository:$VERSION-$arch"
            docker push "$repository:$VERSION-$arch"
          done
          docker buildx imagetools create -t "$repository:$VERSION" \
            "$repository:$VERSION-amd64" "$repository:$VERSION-arm64"
          docker buildx imagetools inspect "$repository:$VERSION"
