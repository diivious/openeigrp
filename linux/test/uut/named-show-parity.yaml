      "argv": [
        "show",
        "neighbors",
        "eth0",
        "detail"
      ],
      "returncode": 0,
      "stdout_contains": [
        "   State: up",
        "Version 15.2/1.4 (TLV 2)",
        "Retransmissions: 7, Current retries: 3",
        "Reliable queue: 0, last received sequence: 123"
