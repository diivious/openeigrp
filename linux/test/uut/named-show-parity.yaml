    {
      "name": "named-ipv4-neighbors",
      "argv": [
        "show",
        "address-family",
        "ipv4",
        "4453",
        "neighbors"
      ],
      "returncode": 0,
      "stdout_contains": [
        "EIGRP-IPv4 VR(eigrprulez) Address-family Neighbors for AS(4453)",
        "Address                 Interface       Hold",
        "192.0.2.2               eth0"
