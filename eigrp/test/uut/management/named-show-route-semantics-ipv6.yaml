# IPv6 EIGRP topology and neighbor state used by named show output.
schema: eigrp-uut-test/v1
topology: ../examples/ipv6-basic-core.yaml
name: named-show-route-semantics-ipv6
steps:
  - start: all
  - validate-convergence:
      timeout: 18
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 'fe80::2', state: up}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: path, successor: true, connected: false}
  - validate-route: {uut: r1, prefix: '2001:db8:3::73/128', table: topology, present: false}
  - links-down:
      - {uut: r2, interface: eth23}
      - {uut: r3, interface: eth32}
  - validate-convergence:
      timeout: 18
      expect:
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: path, present: false}
  - links-up:
      - {uut: r2, interface: eth23}
      - {uut: r3, interface: eth32}
  - validate-convergence:
      timeout: 18
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 'fe80::2', state: up}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: path, successor: true}
  - stop: all
