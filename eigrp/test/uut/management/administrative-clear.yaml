# Exercise the real portable administrative clear targets and DUAL recovery.
schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: operational-clear-neighbor-topology-recovery
steps:
  - start: all
  - validate-convergence:
      timeout: 14
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - clear-events: {uut: r1}
  - clear-neighbors: {uut: r1, target: 10.0.0.2}
  - validate-convergence:
      timeout: 22
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
  - clear-topology: {uut: r1, prefix: 10.2.0.0/24}
  - clear-neighbors: {uut: r1}
  - validate-convergence:
      timeout: 22
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
  - clear-topology: {uut: r2, prefix: 10.1.0.0/24}
  - clear-neighbors: {uut: r2, target: eth0}
  - validate-convergence:
      timeout: 22
      stable_for: 0.4
      expect:
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
  - stop: all
