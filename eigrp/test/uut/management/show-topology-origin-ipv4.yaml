# IPv4 operational topology origin and withdrawal/re-advertisement.
schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: topology-show-origin-redistributed-ipv4
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, timeout: 15}
  - validate-route: {uut: r1, prefix: 10.1.0.0/24, table: path, connected: true, redistributed: false, external: false}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '198.51.100.73/32', metric: 20}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: '198.51.100.73/32', table: path, connected: false, redistributed: true, external: true, rd: 0}
        - route: {uut: r2, prefix: '198.51.100.73/32', table: path, connected: false, redistributed: false, external: true}
  - source-route-remove: {uut: r1, prefix: '198.51.100.73/32'}
  - validate-route: {uut: r1, prefix: '198.51.100.73/32', table: path, present: false, timeout: 15}
  - source-route-add: {uut: r1, prefix: '198.51.100.73/32', metric: 30}
  - validate-route: {uut: r1, prefix: '198.51.100.73/32', table: path, redistributed: true, external: true, timeout: 15}
  - redistribute-remove: {uut: r1, source: static}
  - validate-route: {uut: r1, prefix: '198.51.100.73/32', table: path, present: false, timeout: 15}
  - stop: all
