# IPv6 operational origin and link-local learned next hops.
schema: eigrp-uut-test/v1
topology: ../examples/ipv6-basic-core.yaml
name: topology-show-origin-redistributed-ipv6
steps:
  - start: all
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '2001:db8:100::73/128', metric: 20}
  - validate-convergence:
      timeout: 18
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: '2001:db8:100::73/128', table: path, connected: false, redistributed: true, external: true, rd: 0}
        - route: {uut: r2, prefix: '2001:db8:100::73/128', table: path, connected: false, redistributed: false, external: true}
  - source-route-remove: {uut: r1, prefix: '2001:db8:100::73/128'}
  - validate-route: {uut: r1, prefix: '2001:db8:100::73/128', table: path, present: false, timeout: 18}
  - source-route-add: {uut: r1, prefix: '2001:db8:100::73/128', metric: 30}
  - validate-route: {uut: r1, prefix: '2001:db8:100::73/128', table: path, redistributed: true, external: true, timeout: 18}
  - redistribute-remove: {uut: r1, source: static}
  - validate-route: {uut: r1, prefix: '2001:db8:100::73/128', table: path, present: false, timeout: 18}
  - stop: all
