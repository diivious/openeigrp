# Portable management-observable state through EIGRP operational walkers.
# Native Unix-domain IPC framing and permissions are tested in linux/test/.
schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: operational-state-neighbor-topology-route-recovery
steps:
  - start: all
  - validate-convergence:
      timeout: 14
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: path, next_hop: 10.0.0.2, successor: true}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: path, next_hop: 10.0.0.1, successor: true}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - checkpoint: operational-state-steady
  - links-down:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 14
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: down}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: down}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: path, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: path, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, present: false}
  - checkpoint: operational-state-withdrawn
  - links-up:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 16
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: path, next_hop: 10.0.0.2, successor: true}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: path, next_hop: 10.0.0.1, successor: true}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - checkpoint: operational-state-recovered
  # Repeat process teardown and startup to verify that management-visible
  # neighbor and route state does not depend on a previous run's descriptors.
  # The native AF_UNIX wake mechanism is tested separately in linux/test/.
  - stop: all
  - start: all
  - validate-convergence:
      timeout: 16
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - stop: all
