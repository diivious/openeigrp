# Withdraw and re-advertise a local connected route without losing adjacency.
schema: eigrp-uut-test/v1
topology: ipv4-lifecycle.yaml
name: connected-route-withdrawal-recovery
steps:
  - start: all
  - validate-convergence:
      timeout: 12
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - packet-mark: connected-withdraw
  - link-down: {uut: r1, interface: lan0}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, present: false}
  - validate-packet: {since: connected-withdraw, source_uut: r1, destination_uut: r2, opcode: query, prefix: 10.1.0.0/24, event: delivered, min: 1, timeout: 4}
  - packet-mark: connected-recover
  - link-up: {uut: r1, interface: lan0}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
  - validate-packet: {since: connected-recover, source_uut: r1, destination_uut: r2, opcode: update, prefix: 10.1.0.0/24, event: delivered, min: 1, timeout: 4}
  - packet-mark: second-withdraw
  - link-down: {uut: r1, interface: lan0}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, present: false}
  - validate-packet: {since: second-withdraw, source_uut: r1, destination_uut: r2, opcode: query, prefix: 10.1.0.0/24, event: delivered, min: 1, timeout: 4}
  - link-up: {uut: r1, interface: lan0}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
  - stop: all
