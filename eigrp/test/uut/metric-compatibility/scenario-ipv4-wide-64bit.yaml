schema: eigrp-uut-test/v1
topology: ipv4-wide-64bit.yaml
name: Wide-metric 64-bit distance preservation and recovery
steps:
  - start: all
  - validate-neighbor: {uut: r2, neighbor: 10.44.53.1, interface: eth0, timeout: 10}
  # Cisco default-K wide metric: 6553600 inverse bandwidth,
  # 6553600000 attached delay, 6553600 transit delay. Verify no wrap.
  - validate-convergence:
      timeout: 10
      expect:
        - route: {uut: r2, prefix: 10.255.1.1/32, table: topology, active: false, fd: 6566707200, successors: 1}
        - route: {uut: r2, prefix: 10.255.1.1/32, table: rib, metric: 6566707200}
  - packet-mark: connected-withdrawal
  - links-down:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 15
      expect:
        - route: {uut: r2, prefix: 10.255.1.1/32, table: rib, present: false}
  - links-up:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 15
      expect:
        - route: {uut: r2, prefix: 10.255.1.1/32, table: rib, metric: 6566707200}
  - stop: all
