schema: eigrp-uut-test/v1
topology: ipv4-classic-k2.yaml
name: Classic K2 load adjustment through three-router propagation and recovery
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 12}
  - validate-neighbor: {uut: r2, neighbor: 10.23.0.3, interface: eth23, timeout: 12}
  # K2 divides the already-scaled inverse bandwidth, not an unscaled quotient.
  # K2 = floor(45714176 / (256 - 1)) = 179271.
  - validate-convergence:
      timeout: 20
      stable_for: 0.3
      expect:
        - route: {uut: r2, prefix: 10.255.3.1/32, table: topology, active: false, fd: 46431047, successors: 1}
        - route: {uut: r2, prefix: 10.255.3.1/32, table: path, rd: 46405447, distance: 46431047, successor: true}
        - route: {uut: r1, prefix: 10.255.3.1/32, table: topology, active: false, fd: 46456647, successors: 1}
        - route: {uut: r1, prefix: 10.255.3.1/32, table: path, rd: 46431047, distance: 46456647, successor: true}
        - route: {uut: r1, prefix: 10.255.3.1/32, table: rib, metric: 46456647}
  - packet-mark: link-failure
  - links-down:
      - {uut: r2, interface: eth23}
      - {uut: r3, interface: eth32}
  - validate-convergence:
      timeout: 20
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: 10.255.3.1/32, table: rib, present: false}
        - route: {uut: r2, prefix: 10.255.3.1/32, table: rib, present: false}
  - links-up:
      - {uut: r2, interface: eth23}
      - {uut: r3, interface: eth32}
  - validate-convergence:
      timeout: 20
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: 10.255.3.1/32, table: topology, active: false, fd: 46456647, successors: 1}
        - route: {uut: r1, prefix: 10.255.3.1/32, table: rib, metric: 46456647}
  - stop: all
