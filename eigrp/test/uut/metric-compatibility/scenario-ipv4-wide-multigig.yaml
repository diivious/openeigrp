schema: eigrp-uut-test/v1
topology: ipv4-wide-multigig.yaml
name: Cisco 10-Gbit summary delay conversion and withdrawal
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 10}
  - validate-neighbor: {uut: r2, neighbor: 10.23.0.3, interface: eth23, timeout: 10}
  # Explicit summary-metric delay 1 is 10,000 ns even at 10 Gbit/s.
  - validate-convergence:
      timeout: 10
      expect:
        - route: {uut: r1, prefix: 10.30.0.0/16, table: topology, active: false, fd: 13762560, successors: 1}
        - route: {uut: r1, prefix: 10.30.0.0/16, table: rib, metric: 13762560}
        - route: {uut: r1, prefix: 10.30.0.0/16, table: path, distance: 13762560, successor: true}
  - link-down: {uut: r3, interface: n1}
  - link-down: {uut: r3, interface: n2}
  - validate-convergence:
      timeout: 15
      expect:
        - route: {uut: r1, prefix: 10.30.0.0/16, table: rib, present: false}
  - link-up: {uut: r3, interface: n2}
  - validate-convergence:
      timeout: 15
      expect:
        - route: {uut: r1, prefix: 10.30.0.0/16, table: topology, active: false, fd: 13762560, successors: 1}
        - route: {uut: r1, prefix: 10.30.0.0/16, table: rib, metric: 13762560}
        - route: {uut: r1, prefix: 10.30.0.0/16, table: path, distance: 13762560, successor: true}
  - stop: all
