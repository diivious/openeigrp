schema: eigrp-uut-test/v1
topology: ipv4-kite.yaml
name: DUAL Kite Scenario C - R2 Loses Direct R3 Path
steps:
  - start: r3
  - start: r1
  - validate-route: {uut: r1, prefix: 10.3.0.0/24, table: rib, next_hop: 10.13.0.3, timeout: 7}
  - start: r2
  - validate-neighbor: {uut: r2, neighbor: 10.12.0.1, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r2, prefix: 10.3.0.0/24, table: path, next_hop: 10.12.0.1, successor: false, feasible_successor: false, distance: 26214400, rd: 19660800}
        - route: {uut: r2, prefix: 10.3.0.0/24, table: topology, active: false, successors: 1, fd: 19660800}
  - packet-mark: r2-r3-down
  - link-down: {uut: r2, interface: eth23}
  - link-down: {uut: r3, interface: eth32}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r2, prefix: 10.3.0.0/24, table: topology, active: false, successors: 1, fd: 26214400}
        - route: {uut: r2, prefix: 10.3.0.0/24, table: rib, next_hop: 10.12.0.1, metric: 26214400}
        - route: {uut: r1, prefix: 10.3.0.0/24, table: rib, next_hop: 10.13.0.3, metric: 19660800}
  - validate-packet: {uut: r2, opcode: query, prefix: 10.3.0.0/24, since: r2-r3-down, min: 1, timeout: 2, event: delivered}
