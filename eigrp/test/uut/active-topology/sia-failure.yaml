schema: eigrp-uut-test/v1
topology: ipv4-sia-chain.yaml
name: ACTIVE SIA - missing SIA reply removes stuck neighbor
steps:
  - start: all
  - validate-convergence:
      timeout: 10
      expect:
        # The learned route can precede completion of an upstream RTP INIT.
        # Inject a SIA fault only after the complete chain is established.
        - neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12}
        - neighbor: {uut: r2, neighbor: 10.12.0.1, interface: eth21}
        - neighbor: {uut: r2, neighbor: 10.23.0.3, interface: eth23}
        - neighbor: {uut: r3, neighbor: 10.23.0.2, interface: eth32}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.12.0.2}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: rib, next_hop: 10.23.0.3}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: rib, next_hop: 10.34.0.4}
  - fault-add: {name: drop-root-reply, action: drop, source_uut: r1, destination_uut: r2, opcode: reply, prefix: 10.4.0.0/24}
  - fault-add: {name: drop-target-sia-reply, action: drop, source_uut: r2, destination_uut: r3, opcode: sia-reply, prefix: 10.4.0.0/24}
  - packet-mark: sia-failure
  - link-down: {uut: r4, interface: lan4}
  - validate-route: {uut: r3, prefix: 10.4.0.0/24, table: topology, active: true, timeout: 4}
  - validate-packet: {source_uut: r3, destination_uut: r2, opcode: sia-query, prefix: 10.4.0.0/24, since: sia-failure, min: 1, timeout: 5, event: delivered}
  - validate-fault: {name: drop-target-sia-reply, hits: 1, timeout: 2}
  # A dropped SIA-REPLY alone must not remove an otherwise healthy adjacency.
  - validate-neighbor: {uut: r3, neighbor: 10.23.0.2, interface: eth32, state: up, timeout: 1}
  # The SIA active timer must expire before the stuck neighbor is discarded.
  - validate-neighbor: {uut: r3, neighbor: 10.23.0.2, interface: eth32, state: down, timeout: 5}
  - validate-event: {uut: r3, contains: 'SIA active timer expired: 10.4.0.0/24 ifindex 4 queries 1'}
  - validate-event:
      uut: r3
      contains: 'Peer 10.23.0.2/32: UP -> DOWN ifindex 4 reason stuck in active'
      after: 'SIA active timer expired: 10.4.0.0/24 ifindex 4 queries 1'
  - validate-convergence:
      timeout: 8
      expect:
        - route: {uut: r3, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: rib, present: false}
  # A withdrawal for an already-absent destination must not bounce back and
  # forth between neighbors as a new unreachable topology advertisement.
  - validate-packet: {source_uut: r3, destination_uut: r4, opcode: update, prefix: 10.4.0.0/24, since: sia-failure, min: 0, max: 20, event: delivered}
  - validate-packet: {source_uut: r4, destination_uut: r3, opcode: update, prefix: 10.4.0.0/24, since: sia-failure, min: 0, max: 20, event: delivered}
