# Verify both reset commands use the real UUT handler and withdraw/recover routes.
schema: eigrp-uut-test/v1
name: ipv4-redistribution-metric-reset-lifecycle
topology: ../examples/two-router.yaml
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, timeout: 15}
  - source-route-add: {uut: r1, prefix: '198.18.40.1/32', metric: 20}
  - redistribute-add: {uut: r1, source: static, seed: false}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false}
  - default-metric: {uut: r1, bandwidth: 100000, delay: 125, reliability: 255, load: 1, mtu: 1500}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: true, timeout: 15}
  - default-metric: {uut: r1, reset: true}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false, timeout: 15}
  # Repeating a reset must leave no stale metric or route.
  - default-metric: {uut: r1, reset: true}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false}
  - redistribute-metric: {uut: r1, bandwidth: 100000, delay: 175, reliability: 255, load: 1, mtu: 1500}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: true, timeout: 15}
  - redistribute-metric: {uut: r1, reset: true}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false, timeout: 15}
  - redistribute-metric: {uut: r1, reset: true}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false}
  # Restore after both reset paths and confirm the same route is usable.
  - redistribute-metric: {uut: r1, bandwidth: 100000, delay: 90, reliability: 255, load: 1, mtu: 1500}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '198.18.40.1/32'}
  - validate-route: {uut: r2, prefix: '198.18.40.1/32', table: rib, present: false, timeout: 15}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
