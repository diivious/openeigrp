schema: eigrp-uut-test/v1
topology: ../examples/ipv6-basic-core.yaml
name: Prefix-limit timer violation restart and third-incident lockout (IPv6)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 10}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: violate}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: limit-suspended, observe: 0.3}
  - validate-accounting: {uut: r1, neighbor: fe80::2, interface: eth12, status: P, restart_count: 1, restart_active: true, reset_active: true, observe: 0.2}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: expire}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 12}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: violate}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: limit-suspended, observe: 0.3}
  - validate-accounting: {uut: r1, neighbor: fe80::2, interface: eth12, status: P, restart_count: 2, restart_active: true, reset_active: true, observe: 0.2}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: expire}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 12}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: violate}
  - validate-convergence:
      timeout: 8
      expect:
        - neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: limit-locked, reliable_q: 0}
        - route: {uut: r1, prefix: 2001:db8:3::/64, table: rib, present: false}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: limit-locked, observe: 0.7}
  - validate-accounting: {uut: r1, neighbor: fe80::2, interface: eth12, status: D, restart_count: 3, restart_active: false, reset_active: false, observe: 0.2}
  - peer-limit: {uut: r1, interface: eth12, neighbor: fe80::2, operation: delete}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 12}
  - validate-route: {uut: r1, prefix: 2001:db8:3::/64, table: rib, present: true, timeout: 12}
  - stop: all
