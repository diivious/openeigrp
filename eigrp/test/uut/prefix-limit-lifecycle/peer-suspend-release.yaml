schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Prefix-limit retained-peer lifecycle, suspend, release and delete
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 8}
  - validate-route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2, timeout: 8}
  - peer-limit: {uut: r1, interface: eth0, neighbor: 10.0.0.2, operation: suspend}
  # DOWN retires learned routes but the same peer remains published for penalty ownership.
  - validate-convergence:
      timeout: 8
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-suspended, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, present: false}
  # Ordinary discovery is still arriving but cannot restart a suspended peer.
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-suspended, observe: 0.7}
  - peer-limit: {uut: r1, interface: eth0, neighbor: 10.0.0.2, operation: release}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 12}
  - validate-route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2, timeout: 12}
  - peer-limit: {uut: r1, interface: eth0, neighbor: 10.0.0.2, operation: lock}
  - validate-convergence:
      timeout: 8
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-locked, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, present: false}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-locked, observe: 0.7}
  - peer-limit: {uut: r1, interface: eth0, neighbor: 10.0.0.2, operation: delete}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: down, timeout: 3}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 12}
  - validate-route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2, timeout: 12}
  - stop: all
