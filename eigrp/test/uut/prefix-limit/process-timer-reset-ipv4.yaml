schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Process timer reset expiry preserves adjacency and retires incident history
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 4}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.251/32', metric: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.251/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '192.0.2.252/32', metric: 20}
  - validate-process-limit: {uut: r1, state: 1, restarts: 1, reset_active: true}
  - source-route-remove: {uut: r1, prefix: '192.0.2.252/32'}
  - process-limit-expire: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 1, restart_active: false, reset_active: true}
  - process-limit-reset-expire: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0, restart_active: false, reset_active: false, penalty: 0}
  - process-limit-stale: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0, restart_active: false, reset_active: false, penalty: 0}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 20}
  - source-route-remove: {uut: r1, prefix: '192.0.2.251/32'}
  - redistribute-remove: {uut: r1, source: static}
  - process-limit-config: {uut: r1, maximum: 0}
  - stop: all
