schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Process suspended neighbor remains published and Pending (IPv4)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 4}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.61/32', metric: 20}
  - source-route-add: {uut: r1, prefix: '192.0.2.62/32', metric: 20}
  - validate-process-limit: {uut: r1, state: 1, restarts: 1, restart_active: true}
  - validate-accounting: {uut: r1, neighbor: 10.0.0.2, interface: eth0, status: P, restart_count: 0}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-suspended, timeout: 4}
  - source-route-remove: {uut: r1, prefix: '192.0.2.62/32'}
  - process-limit-clear: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - validate-accounting: {uut: r1, neighbor: 10.0.0.2, interface: eth0, status: A}
  - source-route-remove: {uut: r1, prefix: '192.0.2.61/32'}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
