schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Redistribution clear resets history after automatic restart (IPv4)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - redist-limit-config: {uut: r1, maximum: 1}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.251/32', metric: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.251/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '192.0.2.252/32', metric: 20}
  - validate-redist-limit: {uut: r1, state: 1, restarts: 1, restart_active: true, reset_active: true}
  - source-route-remove: {uut: r1, prefix: '192.0.2.252/32'}
  # The timer changes state back to zero but deliberately retains incident history.
  - redist-limit-expire: {uut: r1}
  - validate-redist-limit: {uut: r1, state: 0, restarts: 1, reset_active: true, count: 1}
  - redist-limit-clear: {uut: r1}
  - validate-redist-limit: {uut: r1, state: 0, restarts: 0, restart_active: false, reset_active: false, count: 1}
  - validate-route: {uut: r2, prefix: '192.0.2.251/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '192.0.2.252/32', metric: 20}
  - validate-redist-limit: {uut: r1, state: 1, restarts: 1, restart_active: true}
  - source-route-remove: {uut: r1, prefix: '192.0.2.252/32'}
  - redist-limit-clear: {uut: r1}
  - validate-redist-limit: {uut: r1, state: 0, restarts: 0, count: 1}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
