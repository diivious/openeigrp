schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Reachable process prefix admission across withdrawal, replacement, and hard-limit suspension
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - validate-route: {uut: r1, prefix: '10.2.0.0/24', table: rib, present: true, timeout: 15}
  # Three connected/learned destinations plus one redistributed route fill the cap.
  - process-limit-config: {uut: r1, maximum: 4}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.201/32', metric: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.201/32', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '192.0.2.201/32'}
  - source-route-add: {uut: r1, prefix: '192.0.2.202/32', metric: 20}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - process-limit: {uut: r1, state: 0, restarts: 0}
        - neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up}
        - route: {uut: r1, prefix: '192.0.2.201/32', table: path, present: false}
        - route: {uut: r2, prefix: '192.0.2.201/32', table: rib, present: false}
        - route: {uut: r2, prefix: '192.0.2.202/32', table: rib, present: true}
  # A genuinely additional reachable destination must still exercise Cisco's
  # default AF-wide suspension, without explicit restart/reset configuration.
  - source-route-add: {uut: r1, prefix: '192.0.2.203/32', metric: 20}
  - validate-process-limit: {uut: r1, state: 1, restarts: 1, restart_active: true, timeout: 8}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: limit-suspended, timeout: 8}
  - source-route-remove: {uut: r1, prefix: '192.0.2.203/32'}
  - process-limit-clear: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.202/32', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '192.0.2.202/32'}
  - redistribute-remove: {uut: r1, source: static}
  - process-limit-config: {uut: r1, maximum: 0}
  - stop: all
