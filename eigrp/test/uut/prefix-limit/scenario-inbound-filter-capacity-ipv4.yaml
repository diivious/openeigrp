schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: ISS-06 inbound-filtered paths do not consume maximum-prefix capacity (IPv4)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 4}
  - inbound-filter-config: {uut: r1, prefix: '192.0.2.241/32'}
  - redistribute-add: {uut: r2, source: static}
  - source-route-add: {uut: r2, prefix: '192.0.2.240/32', metric: 20}
  - validate-route: {uut: r1, prefix: '192.0.2.240/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r2, prefix: '192.0.2.241/32', metric: 20}
  - validate-route: {uut: r1, prefix: '192.0.2.241/32', table: topology, present: false, timeout: 12}
  - validate-route: {uut: r1, prefix: '192.0.2.241/32', table: rib, present: false}
  - validate-process-limit: {uut: r1, state: 0, count: 4}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up}
  # Release the occupied slot while the ACL remains active.
  - source-route-remove: {uut: r2, prefix: '192.0.2.240/32'}
  - validate-route: {uut: r1, prefix: '192.0.2.240/32', table: topology, present: false, timeout: 12}
  - validate-process-limit: {uut: r1, state: 0, count: 3}
  # Withdraw and re-advertise after policy removal: a filtered UPDATE was
  # intentionally not retained as a DUAL path on r1.
  - source-route-remove: {uut: r2, prefix: '192.0.2.241/32'}
  - inbound-filter-config: {uut: r1, prefix: '192.0.2.241/32', enabled: false}
  - source-route-add: {uut: r2, prefix: '192.0.2.241/32', metric: 20}
  - validate-route: {uut: r1, prefix: '192.0.2.241/32', table: rib, present: true, timeout: 15}
  - validate-process-limit: {uut: r1, state: 0, count: 4}
  - source-route-remove: {uut: r2, prefix: '192.0.2.241/32'}
  - validate-route: {uut: r1, prefix: '192.0.2.241/32', table: topology, present: false, timeout: 15}
  - validate-process-limit: {uut: r1, state: 0, count: 3}
  - redistribute-remove: {uut: r2, source: static}
  - process-limit-config: {uut: r1, maximum: 0}
  - stop: all
