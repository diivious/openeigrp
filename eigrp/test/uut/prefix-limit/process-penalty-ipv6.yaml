schema: eigrp-uut-test/v1
topology: ../examples/ipv6-basic-core.yaml
name: Process prefix hard-limit suspends adjacency and redistribution, then recovers (IPv6)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 3}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '2001:db8:ff::221/128', metric: 20}
  - validate-route: {uut: r2, prefix: '2001:db8:ff::221/128', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '2001:db8:ff::222/128', metric: 20}
  - validate-process-limit: {uut: r1, state: 1, restarts: 1, restart_active: true, reset_active: true}
  - validate-accounting: {uut: r1, neighbor: fe80::2, interface: eth12, status: P, restart_count: 0}
  - validate-route: {uut: r2, prefix: '2001:db8:ff::221/128', table: rib, present: false, timeout: 28}
  - source-route-remove: {uut: r1, prefix: '2001:db8:ff::222/128'}
  - process-limit-clear: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0, restart_active: false, reset_active: false}
  - validate-neighbor: {uut: r1, neighbor: fe80::2, interface: eth12, state: up, timeout: 15}
  - validate-accounting: {uut: r1, neighbor: fe80::2, interface: eth12, status: A, restart_count: 0}
  - validate-route: {uut: r2, prefix: '2001:db8:ff::221/128', table: rib, present: true, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 3, warning_only: true}
  - source-route-add: {uut: r1, prefix: '2001:db8:ff::222/128', metric: 20}
  - validate-process-limit: {uut: r1, state: 0}
  - validate-route: {uut: r2, prefix: '2001:db8:ff::222/128', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '2001:db8:ff::221/128'}
  - source-route-remove: {uut: r1, prefix: '2001:db8:ff::222/128'}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
