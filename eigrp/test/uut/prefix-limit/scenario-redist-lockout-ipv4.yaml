schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Redistribution repeated violations timer replay and lockout (IPv4)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - redist-limit-config: {uut: r1, maximum: 1}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.221/32', metric: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '192.0.2.222/32', metric: 20}
  - validate-redist-limit: {uut: r1, state: 1, restarts: 1, restart_active: true}
  # Both original source candidates still exist. Replay must retrigger.
  - redist-limit-expire: {uut: r1}
  - validate-redist-limit: {uut: r1, state: 1, restarts: 2, restart_active: true}
  - redist-limit-expire: {uut: r1}
  - validate-redist-limit: {uut: r1, state: 2, restarts: 3, restart_active: false, reset_active: false}
  - validate-route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: false, timeout: 10}
  - source-route-remove: {uut: r1, prefix: '192.0.2.222/32'}
  # Remote RIB withdrawal alone does not retire the originator's poisoned
  # descriptors. Wait for local DUAL/packetizer cleanup before replay.
  - validate-convergence:
      timeout: 20
      stable_for: 0.3
      expect:
        - redist-limit: {uut: r1, state: 2, restarts: 3, count: 0}
        - route: {uut: r1, prefix: '192.0.2.221/32', table: path, present: false}
        - route: {uut: r1, prefix: '192.0.2.222/32', table: path, present: false}
        - route: {uut: r1, prefix: '192.0.2.221/32', table: topology, present: false}
        - route: {uut: r1, prefix: '192.0.2.222/32', table: topology, present: false}
        - route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: false}
  - redist-limit-clear: {uut: r1}
  # Observe both local admission and remote installation in a stable window.
  - validate-convergence:
      timeout: 20
      stable_for: 0.3
      expect:
        - redist-limit: {uut: r1, state: 0, restarts: 0, count: 1}
        - route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: true}
  - source-route-remove: {uut: r1, prefix: '192.0.2.221/32'}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
