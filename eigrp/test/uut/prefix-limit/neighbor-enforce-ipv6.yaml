schema: eigrp-uut-test/v1
topology: ../examples/ipv6-basic-core.yaml
name: Neighbor maximum-prefix violation defers DOWN cleanup (IPv6)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 'fe80::2', interface: eth12, state: up, timeout: 12}
  - validate-route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, present: true, timeout: 12}
  - peer-limit-config: {uut: r1, maximum: 1}
  - redistribute-add: {uut: r2, source: static}
  - source-route-add: {uut: r2, prefix: '2001:db8:fe::1/128', metric: 20}
  - validate-convergence:
      timeout: 15
      expect:
        - neighbor: {uut: r1, neighbor: 'fe80::2', interface: eth12, state: limit-suspended, reliable_q: 0}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, present: false}
        - route: {uut: r1, prefix: '2001:db8:fe::1/128', table: rib, present: false}
  - source-route-remove: {uut: r2, prefix: '2001:db8:fe::1/128'}
  - redistribute-remove: {uut: r2, source: static}
  - peer-limit: {uut: r1, interface: eth12, neighbor: 'fe80::2', operation: expire}
  - validate-neighbor: {uut: r1, neighbor: 'fe80::2', interface: eth12, state: up, timeout: 12}
  - validate-route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, present: true, timeout: 12}
  - stop: all
