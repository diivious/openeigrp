schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Process prefix hard-limit suspends adjacency and redistribution, then recovers (IPv4)
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 4}
  - redistribute-add: {uut: r1, source: static}
  - source-route-add: {uut: r1, prefix: '192.0.2.221/32', metric: 20}
  - validate-route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: true, timeout: 15}
  - source-route-add: {uut: r1, prefix: '192.0.2.222/32', metric: 20}
  - validate-process-limit: {uut: r1, state: 1, restarts: 1, restart_active: true, reset_active: true}
  - validate-accounting: {uut: r1, neighbor: 10.0.0.2, interface: eth0, status: P, restart_count: 0}
  - validate-route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: false, timeout: 28}
  - source-route-remove: {uut: r1, prefix: '192.0.2.222/32'}
  - process-limit-clear: {uut: r1}
  - validate-process-limit: {uut: r1, state: 0, restarts: 0}
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, interface: eth0, state: up, timeout: 15}
  - validate-accounting: {uut: r1, neighbor: 10.0.0.2, interface: eth0, status: A, restart_count: 0}
  - validate-route: {uut: r2, prefix: '192.0.2.221/32', table: rib, present: true, timeout: 15}
  - process-limit-config: {uut: r1, maximum: 4, warning_only: true}
  - source-route-add: {uut: r1, prefix: '192.0.2.222/32', metric: 20}
  - validate-process-limit: {uut: r1, state: 0}
  - validate-route: {uut: r2, prefix: '192.0.2.222/32', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '192.0.2.221/32'}
  - source-route-remove: {uut: r1, prefix: '192.0.2.222/32'}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
