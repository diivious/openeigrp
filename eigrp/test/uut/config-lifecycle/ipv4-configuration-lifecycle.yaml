# Portable semantic configuration lifecycle, not a daemon file/SIGHUP test.
# Copyright (C) 2026 Donnie V. Savage
schema: eigrp-uut-test/v1
name: ipv4-redist-metric
topology: ../examples/two-router.yaml
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, timeout: 15}
  - source-route-add: {uut: r1, prefix: '198.51.100.199/32', metric: 25}
  # No per-source, route-vector, or default metric is available yet.
  - packet-mark: before-seed
  - redistribute-add: {uut: r1, source: static, seed: false}
  - validate-packet: {uut: r1, event: sent, opcode: update, prefix: '198.51.100.199/32', since: before-seed, min: 0, max: 0, timeout: 1}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: false}
  - packet-mark: first-default
  - default-metric: {uut: r1, bandwidth: 100000, delay: 90, reliability: 255, load: 1, mtu: 1500}
  - validate-packet: {uut: r1, event: delivered, opcode: update, prefix: '198.51.100.199/32', since: first-default, timeout: 15}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, metric: 72089600, timeout: 15}
  - packet-mark: updated-default
  - default-metric: {uut: r1, bandwidth: 100000, delay: 180, reliability: 255, load: 1, mtu: 1500}
  - validate-packet: {uut: r1, event: delivered, opcode: update, prefix: '198.51.100.199/32', since: updated-default, timeout: 15}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, metric: 131072000, timeout: 15}
  - default-metric: {uut: r1, reset: true}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: false, timeout: 15}
  - redistribute-remove: {uut: r1, source: static}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: false, timeout: 15}
  - redistribute-add: {uut: r1, source: static}
  # The default seeded behavior remains available for other UUT scenarios.
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, metric: 78643200, timeout: 15}
  # Source withdrawal and recovery while redistribution is configured.
  - source-route-remove: {uut: r1, prefix: '198.51.100.199/32'}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: false, timeout: 15}
  - source-route-add: {uut: r1, prefix: '198.51.100.199/32', metric: 25}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: true, timeout: 15}
  - source-route-remove: {uut: r1, prefix: '198.51.100.199/32'}
  - validate-route: {uut: r2, prefix: '198.51.100.199/32', table: rib, present: false, timeout: 15}
  - redistribute-remove: {uut: r1, source: static}
  - stop: all
