schema: eigrp-uut-test/v1
topology: ipv4-summary-local-component.yaml
name: Summary Local Connected Component and Split Horizon
steps:
  - start: all
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.12.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r2, prefix: 10.0.0.0/8, table: rib, metric: 19660800}
  - validate-event: {uut: r1, contains: "Summary component: 10.12.0.0/24 metric 13107200"}
  - packet-mark: connected-down
  - link-down: {uut: r1, interface: eth12}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r2, prefix: 10.0.0.0/8, table: rib, present: false}
  - link-up: {uut: r1, interface: eth12}
  - validate-neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, timeout: 7}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r2, prefix: 10.0.0.0/8, table: rib, metric: 19660800}
  - stop: all
