    name: hold-r3-replies
    action: drop
    source_uut: r3
    destination_uut: r1
    opcode: reply
- packet-mark: multi-prefix-loss
- links-down:
  - uut: r1
    interface: eth12
  - uut: r2
    interface: eth21
- validate-convergence:
    timeout: 2
