schema: eigrp-uut-test/v1
name: k6-topology-change-during-active-computation
topology: ipv4-dense-mesh-k6.yaml
steps:
- start: all
- validate-convergence:
    timeout: 12
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 19660800
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: path
        next_hop: 10.14.0.4
        feasible_successor: true
# Wait for the full mesh INIT exchanges before injecting DUAL faults.
- validate-convergence:
    timeout: 20
    expect:
    - neighbor: {uut: r1, neighbor: 10.12.0.2, interface: eth12, state: up}
    - neighbor: {uut: r2, neighbor: 10.12.0.1, interface: eth21, state: up}
    - neighbor: {uut: r1, neighbor: 10.13.0.3, interface: eth13, state: up}
    - neighbor: {uut: r3, neighbor: 10.13.0.1, interface: eth31, state: up}
    - neighbor: {uut: r1, neighbor: 10.14.0.4, interface: eth14, state: up}
    - neighbor: {uut: r4, neighbor: 10.14.0.1, interface: eth41, state: up}
    - neighbor: {uut: r1, neighbor: 10.15.0.5, interface: eth15, state: up}
    - neighbor: {uut: r5, neighbor: 10.15.0.1, interface: eth51, state: up}
    - neighbor: {uut: r1, neighbor: 10.16.0.6, interface: eth16, state: up}
    - neighbor: {uut: r6, neighbor: 10.16.0.1, interface: eth61, state: up}
    - neighbor: {uut: r2, neighbor: 10.23.0.3, interface: eth23, state: up}
    - neighbor: {uut: r3, neighbor: 10.23.0.2, interface: eth32, state: up}
    - neighbor: {uut: r2, neighbor: 10.24.0.4, interface: eth24, state: up}
    - neighbor: {uut: r4, neighbor: 10.24.0.2, interface: eth42, state: up}
    - neighbor: {uut: r2, neighbor: 10.25.0.5, interface: eth25, state: up}
    - neighbor: {uut: r5, neighbor: 10.25.0.2, interface: eth52, state: up}
    - neighbor: {uut: r2, neighbor: 10.26.0.6, interface: eth26, state: up}
    - neighbor: {uut: r6, neighbor: 10.26.0.2, interface: eth62, state: up}
    - neighbor: {uut: r3, neighbor: 10.34.0.4, interface: eth34, state: up}
    - neighbor: {uut: r4, neighbor: 10.34.0.3, interface: eth43, state: up}
    - neighbor: {uut: r3, neighbor: 10.35.0.5, interface: eth35, state: up}
    - neighbor: {uut: r5, neighbor: 10.35.0.3, interface: eth53, state: up}
    - neighbor: {uut: r3, neighbor: 10.36.0.6, interface: eth36, state: up}
    - neighbor: {uut: r6, neighbor: 10.36.0.3, interface: eth63, state: up}
    - neighbor: {uut: r4, neighbor: 10.45.0.5, interface: eth45, state: up}
    - neighbor: {uut: r5, neighbor: 10.45.0.4, interface: eth54, state: up}
    - neighbor: {uut: r4, neighbor: 10.46.0.6, interface: eth46, state: up}
    - neighbor: {uut: r6, neighbor: 10.46.0.4, interface: eth64, state: up}
    - neighbor: {uut: r5, neighbor: 10.56.0.6, interface: eth56, state: up}
    - neighbor: {uut: r6, neighbor: 10.56.0.5, interface: eth65, state: up}

- fault-add:
    name: hold-r3-reply
    action: delay
    source_uut: r3
    destination_uut: r1
    opcode: reply
    delay_ms: 1500
    count: 1
- packet-mark: first-failure
- links-down:
  - uut: r1
    interface: eth12
  - uut: r2
    interface: eth21
- validate-route:
    uut: r1
    prefix: 10.102.0.0/24
    table: topology
    active: true
    timeout: 1
- validate-fault:
    name: hold-r3-reply
    hits: 1
    timeout: 2
- packet-mark: while-active
- links-down:
  - uut: r1
    interface: eth14
  - uut: r4
    interface: eth41
- validate-convergence:
    timeout: 15
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 32768000
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: path
        count: 3
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: path
        next_hop: 10.13.0.3
        successor: true
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 39321600
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: path
        count: 3
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: path
        next_hop: 10.13.0.3
        successor: true
    - route:
        uut: r1
        prefix: 10.105.0.0/24
        table: topology
        active: false
        successors: 1
    - route:
        uut: r1
        prefix: 10.105.0.0/24
        table: path
        count: 3
    - route:
        uut: r1
        prefix: 10.105.0.0/24
        table: path
        next_hop: 10.12.0.2
        present: false
    - route:
        uut: r1
        prefix: 10.105.0.0/24
        table: path
        next_hop: 10.14.0.4
        present: false
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: topology
        active: false
        successors: 1
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: path
        count: 3
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: path
        next_hop: 10.12.0.2
        present: false
    - route:
        uut: r1
        prefix: 10.106.0.0/24
        table: path
        next_hop: 10.14.0.4
        present: false
- validate-packet:
    source_uut: r1
    opcode: query
    prefix: 10.104.0.0/24
    since: while-active
    event: delivered
    min: 3
    max: 3
    group_by:
    - source_uut
    - destination_uut
    max_per_group: 1
    timeout: 1
- validate-packet:
    source_uut: r1
    opcode: query
    prefix: 10.105.0.0/24
    since: while-active
    event: delivered
    min: 0
    max: 0
    timeout: 1
- validate-packet:
    source_uut: r1
    opcode: query
    prefix: 10.106.0.0/24
    since: while-active
    event: delivered
    min: 0
    max: 0
    timeout: 1
- validate-convergence:
    timeout: 5
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r2
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r2
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r3
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r3
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r4
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r4
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r5
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r5
        prefix: 10.104.0.0/24
        table: topology
        active: false
    - route:
        uut: r6
        prefix: 10.102.0.0/24
        table: topology
        active: false
    - route:
        uut: r6
        prefix: 10.104.0.0/24
        table: topology
        active: false
- links-up:
  - uut: r1
    interface: eth12
  - uut: r2
    interface: eth21
  - uut: r1
    interface: eth14
  - uut: r4
    interface: eth41
- validate-convergence:
    timeout: 15
    expect:
    - route:
        uut: r1
        prefix: 10.102.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 19660800
    - route:
        uut: r1
        prefix: 10.104.0.0/24
        table: topology
        active: false
        successors: 1
        fd: 26214400
- stop: all
