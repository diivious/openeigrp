# Portable IPv6 RIB withdrawal/re-advertisement; native Netlink is separate.
schema: eigrp-uut-test/v1
name: ipv6-selected-route-withdrawal-recovery
topology: ipv6-rib.yaml
steps:
  - start: all
  - validate-convergence:
      timeout: 18
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 'fe80::2', state: up}
        - neighbor: {uut: r2, neighbor: 'fe80::1', state: up}
        - route: {uut: r1, prefix: '2001:db8:2::/64', table: rib, next_hop: 'fe80::2'}
        - route: {uut: r2, prefix: '2001:db8:1::/64', table: rib, next_hop: 'fe80::1'}
  - links-down:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: '2001:db8:2::/64', table: rib, present: false}
        - route: {uut: r2, prefix: '2001:db8:1::/64', table: rib, present: false}
  - links-up:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 20
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 'fe80::2', state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 'fe80::1', state: up, reliable_q: 0}
        - route: {uut: r1, prefix: '2001:db8:2::/64', table: rib, next_hop: 'fe80::2'}
        - route: {uut: r2, prefix: '2001:db8:1::/64', table: rib, next_hop: 'fe80::1'}
  - stop: all
