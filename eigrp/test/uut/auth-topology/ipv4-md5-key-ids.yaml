# Three routers use the same MD5 secret but different authentication key IDs.
schema: eigrp-uut-topology/v1
segments:
  shared-lan: {}
routers:
  r1:
    asn: 4453
    router_id: 10.255.0.1
    interfaces:
      lan0:
        segment: shared-lan
        ipv4: 10.51.0.1/24
        authentication: {mode: md5, keychain: md5-lan, key: eigrprocks, key_id: 1}
    attached_networks:
      - {prefix: 10.61.0.1/24, interface: loop1}
  r2:
    asn: 4453
    router_id: 10.255.0.2
    interfaces:
      lan0:
        segment: shared-lan
        ipv4: 10.51.0.2/24
        authentication: {mode: md5, keychain: md5-lan, key: eigrprocks, key_id: 2}
    attached_networks:
      - {prefix: 10.62.0.1/24, interface: loop2}
  r3:
    asn: 4453
    router_id: 10.255.0.3
    interfaces:
      lan0:
        segment: shared-lan
        ipv4: 10.51.0.3/24
        authentication: {mode: md5, keychain: md5-lan, key: eigrprocks, key_id: 1}
    attached_networks:
      - {prefix: 10.63.0.1/24, interface: loop3}
