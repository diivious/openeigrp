schema: eigrp-uut-test/v1
topology: ipv4-md5-mixed-lan.yaml
name: MD5 two authenticated routers and one unauthenticated router
steps:
  - start: all
  # Prove the unprotected router is actually transmitting Hellos on the LAN.
  - validate-packet: {uut: r3, interface: lan0, opcode: hello, min: 1, timeout: 8, event: sent}
  - validate-packet: {source_uut: r3, destination_uut: r1, event: delivered, opcode: hello, min: 1, timeout: 8}
  - validate-packet: {source_uut: r3, destination_uut: r2, event: delivered, opcode: hello, min: 1, timeout: 8}
  - validate-neighbor: {uut: r1, neighbor: 10.41.0.2, interface: lan0, timeout: 10}
  - validate-neighbor: {uut: r2, neighbor: 10.41.0.1, interface: lan0, timeout: 10}
  - validate-convergence:
      timeout: 10
      expect:
        - route: {uut: r1, prefix: 10.22.0.0/24, table: rib, next_hop: 10.41.0.2}
        - route: {uut: r2, prefix: 10.21.0.0/24, table: rib, next_hop: 10.41.0.1}
        - route: {uut: r1, prefix: 10.22.0.0/24, table: topology, active: false, successors: 1}
        - route: {uut: r2, prefix: 10.21.0.0/24, table: topology, active: false, successors: 1}
  - packet-mark: established
  # Absence must remain true across an observation window, not one snapshot.
  - validate-neighbor: {uut: r1, neighbor: 10.41.0.3, state: down, observe: 3}
  - validate-neighbor: {uut: r2, neighbor: 10.41.0.3, state: down, observe: 3}
  - validate-neighbor: {uut: r3, neighbor: 10.41.0.1, state: down, observe: 3}
  - validate-neighbor: {uut: r3, neighbor: 10.41.0.2, state: down, observe: 3}
  # R3 keeps sending unauthenticated Hellos during the rejection checks.
  - validate-packet: {uut: r3, interface: lan0, opcode: hello, since: established, min: 1, timeout: 8, event: sent}
  - validate-convergence:
      timeout: 3
      expect:
        - route: {uut: r1, prefix: 10.23.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.23.0.0/24, table: rib, present: false}
        - route: {uut: r3, prefix: 10.21.0.0/24, table: rib, present: false}
        - route: {uut: r3, prefix: 10.22.0.0/24, table: rib, present: false}
        - neighbor: {uut: r1, neighbor: 10.41.0.2, interface: lan0}
        - neighbor: {uut: r2, neighbor: 10.41.0.1, interface: lan0}
        - route: {uut: r1, prefix: 10.22.0.0/24, table: rib, next_hop: 10.41.0.2}
        - route: {uut: r2, prefix: 10.21.0.0/24, table: rib, next_hop: 10.41.0.1}
