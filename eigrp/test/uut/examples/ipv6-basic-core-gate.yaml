schema: eigrp-uut-test/v1
topology: ipv6-basic-core.yaml
name: IPv6 Three-Router Basic Core Gate
steps:
  - packet-mark: startup
  - start: all
  - validate-packet: {uut: r1, interface: eth12, opcode: hello, min: 1, timeout: 7, event: sent}
  - validate-packet: {uut: r2, interface: eth23, opcode: hello, min: 1, timeout: 7, event: sent}
  - validate-neighbor: {uut: r1, neighbor: 'fe80::2', interface: eth12, timeout: 7}
  - validate-neighbor: {uut: r2, neighbor: 'fe80::1', interface: eth21, timeout: 7}
  - validate-neighbor: {uut: r2, neighbor: 'fe80::3', interface: eth23, timeout: 7}
  - validate-neighbor: {uut: r3, neighbor: 'fe80::2', interface: eth32, timeout: 7}
  - validate-packet: {uut: r2, opcode: update, prefix: '2001:db8:3::/64', min: 1, timeout: 7, event: delivered}
  - validate-packet: {uut: r2, opcode: update, prefix: '2001:db8:1::/64', min: 1, timeout: 7, event: delivered}
  - validate-packet: {uut: r1, opcode: ack, min: 1, timeout: 7, event: sent}
  - validate-convergence:
      timeout: 7
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, next_hop: 'fe80::2', metric: 8519680, distance: 90}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: rib, next_hop: 'fe80::2', metric: 8519680, distance: 90}
        - route: {uut: r1, prefix: 'fe80::2/128', table: rib, present: false}
        - route: {uut: r3, prefix: 'fe80::2/128', table: rib, present: false}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: path, next_hop: 'fe80::2', interface: eth12, successor: true, connected: false, rd: 7864320}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: path, next_hop: 'fe80::2', interface: eth32, successor: true, connected: false, rd: 7864320}
  - validate-packet: {opcode: update, prefix: 'fe80::1/128', since: startup, event: any, min: 0, max: 0, timeout: 0.2}
  - validate-packet: {opcode: update, prefix: 'fe80::2/128', since: startup, event: any, min: 0, max: 0, timeout: 0.2}
  - validate-packet: {opcode: update, prefix: 'fe80::3/128', since: startup, event: any, min: 0, max: 0, timeout: 0.2}
  - packet-mark: failure
  - link-down: {uut: r2, interface: eth23}
  - link-down: {uut: r3, interface: eth32}
  - validate-neighbor: {uut: r2, neighbor: 'fe80::3', interface: eth23, state: down, timeout: 3}
  - validate-neighbor: {uut: r3, neighbor: 'fe80::2', interface: eth32, state: down, timeout: 3}
  - validate-packet: {uut: r2, interface: eth21, opcode: query, prefix: '2001:db8:3::/64', since: failure, min: 1, timeout: 3, event: delivered}
  - validate-packet: {uut: r1, interface: eth12, opcode: reply, prefix: '2001:db8:3::/64', since: failure, min: 1, timeout: 3, event: delivered}
  - validate-convergence:
      timeout: 5
      expect:
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, present: false}
        - route: {uut: r2, prefix: '2001:db8:3::/64', table: rib, present: false}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: rib, present: false}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: topology, present: false}
        - route: {uut: r2, prefix: '2001:db8:3::/64', table: topology, present: false}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: topology, present: false}
  # Passive connected interfaces remain eligible while transit peers are down.
  - validate-route: {uut: r1, prefix: '2001:db8:1::/64', table: topology, present: true, timeout: 5}
  - validate-route: {uut: r3, prefix: '2001:db8:3::/64', table: topology, present: true, timeout: 5}
  - packet-mark: recovery
  - link-up: {uut: r2, interface: eth23}
  - link-up: {uut: r3, interface: eth32}
  - validate-neighbor: {uut: r2, neighbor: 'fe80::3', interface: eth23, timeout: 7}
  - validate-neighbor: {uut: r3, neighbor: 'fe80::2', interface: eth32, timeout: 7}
  - validate-packet: {uut: r2, interface: eth23, opcode: update, prefix: '2001:db8:1::/64', since: recovery, min: 1, timeout: 7, event: sent}
  - validate-convergence:
      timeout: 7
      stable_for: 0.3
      expect:
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: rib, next_hop: 'fe80::2', metric: 8519680, distance: 90}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: rib, next_hop: 'fe80::2', metric: 8519680, distance: 90}
        - route: {uut: r1, prefix: 'fe80::2/128', table: rib, present: false}
        - route: {uut: r3, prefix: 'fe80::2/128', table: rib, present: false}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: topology, active: false, successors: 1, fd: 8519680}
        - route: {uut: r1, prefix: '2001:db8:3::/64', table: path, next_hop: 'fe80::2', interface: eth12, successor: true, connected: false, rd: 7864320}
        - route: {uut: r3, prefix: '2001:db8:1::/64', table: path, next_hop: 'fe80::2', interface: eth32, successor: true, connected: false, rd: 7864320}
