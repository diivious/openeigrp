# Real EIGRP lifecycle check for the test-side polling/stability framework.
# Simulated time is reserved for the Python unit tests, not this UUT scenario.
schema: eigrp-uut-test/v1
topology: two-router.yaml
name: framework-polling-stability-regression
steps:
  - start: all
  - validate-convergence:
      timeout: 12
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - packet-mark: before-withdrawal
  - links-down:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 10
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: down}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: down}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, present: false}
  - links-up:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 12
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - validate-packet: {since: before-withdrawal, event: send-error, min: 0, max: 0, timeout: 0.3}
  - stop: all
