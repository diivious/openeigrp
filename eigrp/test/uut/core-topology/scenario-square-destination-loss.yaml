schema: eigrp-uut-test/v1
topology: ipv4-core-square.yaml
name: Core Topology A2 - Square Destination Loss
steps:
  - start: r4
  - start: r2
  - start: r3
  - start: r1
  - validate-route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 32768000, timeout: 7}
  - packet-mark: square-n1-down
  - link-down: {uut: r4, interface: lan4}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: rib, present: false}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: rib, present: false}
        - route: {uut: r4, prefix: 10.4.0.0/24, table: topology, present: false}
        - route: {uut: r4, prefix: 10.4.0.0/24, table: rib, present: false}
  - validate-packet: {opcode: query, prefix: 10.4.0.0/24, since: square-n1-down, min: 1, timeout: 2, event: delivered}
  - validate-packet: {opcode: reply, prefix: 10.4.0.0/24, since: square-n1-down, min: 1, timeout: 2, event: delivered}
  - packet-mark: square-n1-up
  - link-up: {uut: r4, interface: lan4}
  - validate-convergence:
      timeout: 7
      expect:
        - route: {uut: r1, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 32768000}
        - route: {uut: r1, prefix: 10.4.0.0/24, table: rib, next_hop: 10.12.0.2, metric: 32768000}
        - route: {uut: r2, prefix: 10.4.0.0/24, table: rib, next_hop: 10.24.0.4, metric: 19660800}
        - route: {uut: r3, prefix: 10.4.0.0/24, table: rib, next_hop: 10.34.0.4, metric: 19660800}
        - route: {uut: r4, prefix: 10.4.0.0/24, table: topology, active: false, successors: 1, fd: 13107200}
