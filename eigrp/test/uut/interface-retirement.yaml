schema: eigrp-uut-test/v1
topology: ../rtp/two-router.yaml
name: interface-retirement-neighbor-withdrawal-recovery
steps:
  - start: all
  - validate-convergence:
      timeout: 12
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - packet-mark: interface-down
  - links-down:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 10
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: down}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: down}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, present: false}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: topology, present: false}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: topology, present: false}
  - packet-mark: interface-recovery
  - links-up:
      - {uut: r1, interface: eth0}
      - {uut: r2, interface: eth0}
  - validate-convergence:
      timeout: 12
      stable_for: 0.4
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - validate-packet: {since: interface-recovery, source_uut: r1, source_interface: eth0, event: send-error, min: 0, max: 0, timeout: 0.3}
  - validate-packet: {since: interface-recovery, source_uut: r2, source_interface: eth0, event: send-error, min: 0, max: 0, timeout: 0.3}
  - packet-mark: process-stop
  - stop: r2
  # Process termination does not guarantee a remote goodbye. Allow the
  # surviving peer's hold timer to expire before demanding retirement.
  - validate-convergence:
      timeout: 24
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: down}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, present: false}
  - start: r2
  - validate-convergence:
      timeout: 15
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up, reliable_q: 0}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up, reliable_q: 0}
        - route: {uut: r1, prefix: 10.2.0.0/24, table: rib, next_hop: 10.0.0.2}
        - route: {uut: r2, prefix: 10.1.0.0/24, table: rib, next_hop: 10.0.0.1}
  - stop: all
