# The portable node advertises the single generated EIGRP_RELEASE on each
# router before and after receiving Hellos. Native Linux/FRR Vendor OS
# major/minor encoding is tested by compiled host-callback tests.
schema: eigrp-uut-test/v1
topology: ../examples/two-router.yaml
name: Both portable routers report the same generated core build identity
steps:
  - start: all
  - validate-capability: {uut: r1, release: "@build"}
  - validate-capability: {uut: r2, release: "@build"}
  - validate-packet: {source_uut: r1, destination_uut: r2, opcode: hello, event: delivered, min: 1, timeout: 8}
  - validate-packet: {source_uut: r2, destination_uut: r1, opcode: hello, event: delivered, min: 1, timeout: 8}
  - validate-convergence:
      timeout: 12
      stable_for: 0.3
      expect:
        - neighbor: {uut: r1, neighbor: 10.0.0.2, state: up}
        - neighbor: {uut: r2, neighbor: 10.0.0.1, state: up}
  - validate-capability: {uut: r1, release: "@build"}
  - validate-capability: {uut: r2, release: "@build"}
  - stop: all
